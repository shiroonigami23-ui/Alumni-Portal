name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

  smoke:
    name: Routes & security smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, fileinfo, zip
          coverage: none
      - name: Run tests/smoke/routes.sh
        run: bash tests/smoke/routes.sh

  integration:
    name: End-to-end API tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alumni_portal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: alumni_portal
      DB_USER: postgres
      DB_PASSWORD: postgres
      RATE_LIMIT_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, fileinfo, zip, gd, exif
          coverage: none
      - name: Install database (schema + feature tables + demo data)
        run: php scripts/install_db.php --demo --admin-password='Admin@12345'
      - name: Start app
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8099 router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8099/healthz && break; sleep 0.5; done
      - name: Run tests/integration/run.php
        run: php tests/integration/run.php http://127.0.0.1:8099
      - name: Authorization sweep (members vs. every staff endpoint)
        run: BASE_URL=http://127.0.0.1:8099/ php tests/integration/authz.php
      - name: SQL-injection fuzz (every endpoint × every parameter)
        run: BASE_URL=http://127.0.0.1:8099/ SERVER_LOG=/tmp/server.log php tests/integration/sqli_fuzz.php
      - name: Brute-force lockout (rate limiting ON)
        run: |
          RATE_LIMIT_DISABLED=false LOGIN_MAX_FAILURES=3 php -S 127.0.0.1:8098 router.php > /tmp/server2.log 2>&1 &
          sleep 1
          LOGIN_MAX_FAILURES=3 php tests/integration/security_limits.php http://127.0.0.1:8098
      - name: No PHP warnings or errors in the server log
        if: always()
        run: |
          if grep -E "PHP (Fatal|Warning|Notice|Deprecated)" /tmp/server.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            tests/results/integration-latest.md
            tests/results/integration-latest.json
            tests/results/authz-latest.json
            tests/results/sqli-latest.json
            /tmp/server.log

  browser:
    name: Browser tests (Chrome) + XSS sweep
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alumni_portal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: alumni_portal
      DB_USER: postgres
      DB_PASSWORD: postgres
      RATE_LIMIT_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, fileinfo, zip, gd, exif
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Install database + start app
        run: |
          php scripts/install_db.php --demo --admin-password='Admin@12345'
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8099 router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8099/healthz && break; sleep 0.5; done
      - name: Every page × every role + click-through flows
        run: python tests/ui/browser_smoke.py
      - name: Stored-XSS sweep (payload in every field, every page)
        run: python tests/ui/xss_sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            tests/results/ui-latest.md
            tests/results/xss-latest.json
            /tmp/server.log

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No runtime data or secrets committed
        run: |
          bad=$(git ls-files | grep -E '^storage/(messages|exports|resumes|verification|logs|comments|posts|jobs|events|announcements)/|^storage/log\.txt$|(^|/)\.env$|\.pem$|\.key$' || true)
          if [ -n "$bad" ]; then echo "::error::Runtime data or secrets committed:"; echo "$bad"; exit 1; fi
          echo "Clean."
      - name: Root stays tidy (pages belong in pages/)
        run: |
          extra=$(ls *.php | grep -vxE 'index\.php|router\.php' || true)
          if [ -n "$extra" ]; then echo "::error::Move these into pages/ and add a route: $extra"; exit 1; fi
          echo "Root is tidy."
