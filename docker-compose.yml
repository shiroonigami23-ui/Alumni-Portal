version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=alumni_portal
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - APP_ENV=development
      - APP_DEBUG=true
      - REDIS_HOST=redis
      - CACHE_DRIVER=auto
      - DB_PERSISTENT=true
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    networks:
      - alumni-network

  # Runs cron/run.php every minute: scheduled posts, student→alumni promotion, purge (and archive if enabled)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "while true; do php /var/www/html/cron/run.php; sleep 60; done"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=alumni_portal
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - alumni-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=alumni_portal
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - alumni-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - alumni-network

volumes:
  postgres-data:

networks:
  alumni-network:
    driver: bridge
